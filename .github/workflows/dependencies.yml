name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Check the locked Python dependencies before installation
        run: uv audit --locked --no-build
      - name: Audit the isolated Python build tools
        run: |
          python -I - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory
          import tomllib

          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          requirements = [
              entry["requirement"]
              for entry in metadata["tool"]["uv"]["build-constraint-dependencies"]
          ]
          python_version = Path(".python-version").read_text().strip()
          with TemporaryDirectory(prefix="outrider-build-audit-") as directory:
              project = Path(directory) / "pyproject.toml"
              project.write_text(
                  '[project]\nname = "outrider-build-audit"\nversion = "0"\n'
                  + "requires-python = " + json.dumps(metadata["project"]["requires-python"]) + "\n"
                  + "dependencies = " + json.dumps(requirements) + "\n"
              )
              subprocess.run(
                  ["uv", "lock", "--project", directory, "--python", python_version, "--no-build"],
                  check=True,
              )
              subprocess.run(
                  ["uv", "audit", "--project", directory, "--locked", "--no-build"],
                  check=True,
              )
          PY

  dashboard:
    name: Dashboard dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.3"
      - name: Audit the lockfile without installing packages
        working-directory: dashboard
        run: npm audit --package-lock-only --ignore-scripts
