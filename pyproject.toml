[project]
name = "outrider"
version = "0.1.0"
description = "Agentic PR review — structure-aware, HITL-gated, append-only audit"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    # Web / API
    "fastapi==0.135.3",
    "uvicorn[standard]==0.47.0",
    "httpx==0.28.1",
    # Agent / LLM
    "langgraph==1.2.14",
    "langgraph-checkpoint-postgres==3.1.3",
    "anthropic==0.100.0",
    # GLM 5.2 via Baseten (OpenAI-compatible) — second LLM provider mode.
    # `import openai` is confined to src/outrider/llm/ per trust boundary #8
    # (allowlisted in scripts/check_import_boundaries.py). See GLM_PROVIDER_THOUGHTS.md.
    "openai==2.44.0",
    # Schema / validation / settings
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    # Database — single driver (psycopg3) for both SQLAlchemy and LangGraph
    # See DECISIONS.md #001 (supersedes spec §14.1 two-driver pattern)
    "sqlalchemy[asyncio]==2.0.49",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.9",
    # GitHub
    "githubkit==0.15.3",
    "pyjwt[crypto]==2.15.0",
    # Crypto — Slack bot-token encryption at rest (DECISIONS.md#051). Present
    # transitively via pyjwt[crypto]; pinned explicit because notify/token_crypto.py
    # imports it directly (Fernet) — don't rely on a transitive for a direct import.
    "cryptography==50.0.2",
    # Tree-sitter
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    # Diff parsing
    "unidiff==0.7.5",
    # Logging
    "structlog==25.5.0",
    # ── V2 (Celery task queue + Redis broker — not active in V1) ────────────
    # "celery==5.6.3",
    # "redis==7.4.0",
    # ────────────────────────────────────────────────────────────────────────
    "slack-sdk==3.42.0",
    "aiohttp==3.14.4",  # slack_sdk AsyncWebClient's async HTTP backend (not auto-installed)
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "mypy==1.20.2",
    "ruff==0.15.11",
    "pre-commit==4.5.1",
    # DEV-ONLY, and deliberately so: the Arc 2 strict-schema probe's proof-boundary
    # tests assert that wrong-tier shapes are UNREPRESENTABLE. Validating that claim
    # with a hand-rolled checker would prove nothing (a negative test passing because
    # our own validator is buggy is worse than no test), so the reference JSON Schema
    # implementation is the validator. NOT a production dependency: no `src/outrider/`
    # module imports it, and local validation is NOT proof that OpenAI's strict-subset
    # validator agrees — that is exactly what the paid probe row exists to check.
    "jsonschema==4.26.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.13.7"
# The editable build uses the same verified build dependencies on every machine.
require-build-hashes = true
build-constraint-dependencies = [
    { requirement = "editables==0.5", hashes = ["sha256:61e5ffa82629e0d8bfe09bc44a07db3c1ab8ed1ce78a6980732870f19b5e7d4c", "sha256:309627d9b5c4adc0e668d8c6fa7bac1ba7c8c5d415c2d27f60f081f8e80d1de2"] },
    { requirement = "hatchling==1.33.0", hashes = ["sha256:415290b84f464d2884303fca8974d38e7b85579069fab02a15db0828fbb1446d", "sha256:4c422bd4d554fcff5de5b73e9596f85e41e9f97f7e553d8f7595ecb31a627bef"] },
    { requirement = "packaging==26.1", hashes = ["sha256:5d9c0669c6285e491e0ced2eee587eaf67b670d94a19e94e3984a481aba6802f", "sha256:f042152b681c4bfac5cae2742a55e103d27ab2ec0f3d88037136b6bfe7c9c5de"] },
    { requirement = "pathspec==1.0.4", hashes = ["sha256:fb6ae2fd4e7c921a165808a552060e722767cfa526f99ca5156ed2ce45a5c723", "sha256:0210e2ae8a21a9137c0d470578cb0e595af87edaa6ebf12ff176f14a02e0e645"] },
    { requirement = "pluggy==1.6.0", hashes = ["sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746", "sha256:7dcc130b76258d33b90f61b658791dede3486c3e6bfb003ee5c9bfb396dd22f3"] },
    { requirement = "tomlkit==0.15.2", hashes = ["sha256:05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437", "sha256:83e32755ba1d20d9340bd069ee97e9f6232ba2346b63ffcba425de01f7e327a6"] },
    { requirement = "trove-classifiers==2026.9.21.13", hashes = ["sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17", "sha256:0a9ebc8d4e2f3e8a22848c5258033035bec17a3012ac3fea16dbaa764489eb71"] },
]

[tool.hatch.build.targets.wheel]
packages = ["src/outrider"]

[tool.pytest.ini_options]
# `pythonpath = ["src"]` only — `tests/` is NOT importable from `src/` per
# `docs/conventions.md`. Cross-tier test imports (e.g., harness-internal
# tests consuming eval-harness factories) live inside `tests/eval/` itself
# and use relative imports (`from .fixtures import ...`).
#
# One deliberate exception, kept OUT of this shared setting: `tests/unit/
# conftest.py` puts the repo root on `sys.path` so the Arc 2 unit tests can
# import the `spikes/openai/arc2/` probe modules they verify. It lives in that
# conftest rather than here so the widening is scoped to the tier that needs
# it; see that file for why re-implementing the derivation (the `spikes/`
# duplication pattern used by eval instruments) would not be a valid test.
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py313"
# force-exclude makes ruff honor extend-exclude even when files are passed
# explicitly on the command line (as pre-commit does).
force-exclude = true
extend-exclude = [
    # Vendored upstream code (pygoat) — not Outrider-authored, not our style problem.
    "spikes/tree_sitter/fixtures/pygoat_introduction_views.py",
    # Intentionally malformed Python — fixtures for ast_facts parse-failure handling.
    "spikes/tree_sitter/fixtures/syntax_error_inside_scope.py",
    "spikes/tree_sitter/fixtures/syntax_error_outside_scope.py",
    # Live-run PR corpus — deliberately-vulnerable multi-language demo files copied into the
    # sandbox repo for the live everything-run (see LIVE_RUN_EXPECTED_FINDINGS.md). Every S-rule
    # hit is a planted flaw the review must detect; not Outrider code, never imported or run here.
    "scripts/demo_fixtures/live_pr_corpus/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "TCH", "S"]

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy resolves `Mapped[...]` annotations at runtime (mapper configuration), so imports
# used only in ORM-model annotations (e.g. datetime, uuid.UUID) must stay runtime imports — moving
# them into a TYPE_CHECKING block breaks mapper setup. Tell the TC rules that Base subclasses are
# runtime-evaluated so they aren't flagged (TC003).
runtime-evaluated-base-classes = ["outrider.db.models._base.Base"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]       # assert is fine in tests
"tests/fixtures/python_canonical.py" = ["I", "F"]  # test data fixture; not imported/run
"scripts/test_*.py" = ["S603", "S101"]  # smoke tests run trusted local scripts; assert is fine in tests
"spikes/**/*.py" = ["S", "N"]   # throwaway — relax security and naming, keep bugbear
# Live-review demo fixtures: input to the seed demo, carrying deliberate planted
# flaws. They must read as plausible production code (no inline noqa, which the
# triage model would read as a "skip this, it's test scaffolding" signal), so the
# planted-flaw suppressions live here — scoped to the exact file + exact rule.
# See scripts/demo_fixtures/README.md. NOT a wildcard: each file ignores only the
# specific rules its planted flaw trips, so every OTHER ruff rule still applies to
# the file. (The ignore is rule-scoped, not line-scoped — a second accidental hit
# of the same rule in that file would also be suppressed; acceptable for these
# tiny single-purpose fixtures.)
"scripts/demo_fixtures/vulnerable_query.py" = ["S608"]        # planted SQL injection
"scripts/demo_fixtures/weak_crypto_handler.py" = ["S304"]     # planted weak cipher (DES/ECB)
"scripts/demo_fixtures/report_builder.py" = ["S110", "SIM105"]  # planted bare try-except-pass

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# unidiff==0.7.5 ships no type stubs; consume as untyped under --strict.
[[tool.mypy.overrides]]
module = ["unidiff", "unidiff.*"]
ignore_missing_imports = true


[tool.alembic]

# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = "%(here)s/db/migrations"

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
# Or organize into date-based subdirectories (requires recursive_version_locations = true)
# file_template = "%%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s"

# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
    "."
]

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the tzdata library which can be installed by adding
# `alembic[tz]` to the pip requirements.
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = [
#    "%(here)s/alembic/versions",
#    "%(here)s/foo/bar"
# ]


# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = "utf-8"

# This section defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples
# [[tool.alembic.post_write_hooks]]
# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# name = "black"
# type = "console_scripts"
# entrypoint = "black"
# options = "-l 79 REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
# name = "ruff"
# type = "module"
# module = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# Alternatively, use the exec runner to execute a binary found on your PATH
# name = "ruff"
# type = "exec"
# executable = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"

