# Local PostgreSQL services for development and automated tests.
# postgres keeps development data across restarts. postgres-test uses temporary
# storage and is the only database automated tests should use. Point
# TEST_DATABASE_URL at postgres-test, never the development database.
# Settings come from .env. For production, use deploy/docker-compose.prod.yml.

x-security-hardened: &security-hardened
  security_opt:
    - no-new-privileges:true
  read_only: true
  cap_drop:
    - ALL

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    <<: *security-hardened
    image: postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    container_name: outrider-postgres
    restart: unless-stopped

    # Capabilities the official postgres image needs ONLY during init:
    #   CHOWN, FOWNER, DAC_OVERRIDE — chown the data dir + config files
    #   SETGID, SETUID                — gosu drops root → postgres user
    # Once the postgres process is running, none of these are exercised.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # State that must persist across container restarts: the postgres data
    # parent directory. PG18 stores data in a major-version subdirectory
    # (/var/lib/postgresql/18/docker/) so that pg_upgrade --link can move
    # across major versions without mount-point boundary issues. Mount the
    # PARENT, not /var/lib/postgresql/data — that's the pre-PG18 convention
    # and PG18's entrypoint refuses to init against it. See
    # https://github.com/docker-library/postgres/pull/1259
    # State that is regenerable: socket dir, /tmp. Tmpfs covers the latter so
    # read_only root filesystem doesn't break socket creation.
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
      - /var/run/postgresql

    # Required env. Compose's `:?` syntax fails fast if .env is missing the var
    # rather than starting Postgres with a default password.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      # Force SCRAM-SHA-256 for both connection types. The image default
      # accepts md5 as a fallback; this closes that.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"

    # 127.0.0.1 binding: reachable from the host (uv-run pytest, alembic CLI),
    # not advertised on the LAN. Do not change to 0.0.0.0 in this dev compose.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    networks:
      - outrider-net

    # Runtime-tunable Postgres settings. log_statement=ddl catches accidental
    # schema mutations during dev; log_min_duration_statement surfaces slow
    # queries early; the rest is connection-audit hygiene.
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
      - -c
      - log_min_duration_statement=500

    # Shared-memory headroom for parallel queries. Default Docker shm is 64M
    # which can be tight for postgres; 256M is comfortable for V1 traffic
    # without granting SYS_ADMIN for shared-memory ops.
    shm_size: 256mb

    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging: *default-logging

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M

  # ─────────────────────────────────────────────────────────────────────
  # Integration-test database — separate Postgres instance from the dev
  # one above, with ephemeral tmpfs data so every container restart wipes
  # state. Tests connect here exclusively (TEST_DATABASE_URL); the dev
  # DB above is never touched by the automated test suite.
  #
  # Why this isolation matters: the integration test fixture creates and
  # drops per-test databases via `CREATE DATABASE`/`DROP DATABASE`, which
  # requires admin privileges on the Postgres instance. Running those
  # against the dev container would mean a buggy fixture could (in
  # principle) DROP the dev `outrider` DB. With a separate container
  # whose data lives only in tmpfs, the worst-case blast radius is
  # "test container needs a restart" — dev data is untouchable because
  # it lives in a different process the tests cannot reach.
  #
  # The container shares everything else with the dev one: same image,
  # same hardening, same auth method, same network. Only differences:
  # tmpfs data, port 5433, separate credentials env vars (TEST_*).
  # ─────────────────────────────────────────────────────────────────────
  postgres-test:
    <<: *security-hardened
    image: postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    container_name: outrider-postgres-test
    restart: unless-stopped

    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # tmpfs for the entire postgres data parent — every container start
    # initdbs from scratch. No named volume; nothing persists. This is
    # the heart of the isolation: there is no state to corrupt across
    # test runs, and the container can be recreated freely.
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql:size=512m
      - /tmp
      - /var/run/postgresql

    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:?TEST_POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?TEST_POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${TEST_POSTGRES_DB:?TEST_POSTGRES_DB must be set in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"

    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"

    networks:
      - outrider-net

    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
      - -c
      - log_min_duration_statement=500
      # fsync off and synchronous_commit off are safe ONLY because the
      # data directory is tmpfs — there's nothing on disk to lose. Worth
      # an order-of-magnitude faster CREATE/DROP DATABASE per test.
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off

    shm_size: 256mb

    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging: *default-logging

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M

# Future services (FastAPI app, dashboard, redis V2) attach to this network
# and inherit *security-hardened by anchor merge. Volumes follow the
# `<service>-<purpose>` naming convention.
volumes:
  postgres-data:
    name: outrider-postgres-data
    driver: local

networks:
  outrider-net:
    name: outrider-net
    driver: bridge
